name: Daily Breakout Scanner

on:
  schedule:
    # Runs at 09:45 UTC (3:15 PM IST) on Monday through Friday
    - cron: '45 9 * * 1-5'
  
  # Allows you to trigger the scanner manually
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scanner
        run: |
          python daily_scanner.py
