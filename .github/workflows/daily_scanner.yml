name: Daily Breakout Scanner

on:
  schedule:
    # Runs at 09:45 UTC (3:15 PM IST) on Monday through Friday
    - cron: '45 9 * * 1-5'
  
  # Allows you to trigger the scanner manually from the GitHub Actions tab
  workflow_dispatch: 

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy lightgbm pyarrow fastparquet
          # Add any other libraries your data_fetcher.py requires here

      - name: Fetch Latest Market Data
        run: |
          # Replace 'data_fetcher.py' with your actual data pipeline script
          python data_fetcher.py 

      - name: Run Daily Scanner
        run: |
          python daily_scanner.py
