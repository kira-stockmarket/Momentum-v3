name: NIFTY 50 Data Downloader

on:
  workflow_dispatch: # Allows manual trigger from the GitHub UI
  schedule:
    # Runs automatically every Friday at 20:00 UTC (after Indian markets close)
    - cron: '0 20 * * 5'

jobs:
  download-market-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Downloader Script
        run: python download_nifty50.py

      - name: Upload Parquet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nifty50-historical-parquet
          path: nifty50_data/*.parquet
          retention-days: 7 # Stores the data for 1 week for training pipelines
